<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb"><title>CA Inter Law Revision</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#172033;--muted:#66728a;--line:#e1e6ef;--accent:#315ee8;--tint:#eaf0ff;--good:#14845b;--danger:#c0394b;--shadow:0 8px 26px #15254b0b}
[data-theme=dark]{--bg:#101521;--panel:#192131;--text:#edf2ff;--muted:#a5b0c5;--line:#303b50;--accent:#91aaff;--tint:#26345a;--good:#55d4a0;--danger:#ff8795;--shadow:0 8px 26px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,textarea{font:inherit}button,.file{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel);color:var(--text);cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--danger)}button:disabled{opacity:.45}.app{max-width:900px;margin:auto;padding:16px 14px 36px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-weight:850;font-size:1.15rem}.muted,.hint{color:var(--muted);font-size:.88rem}.search,input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);color:var(--text);outline-color:var(--accent)}.search{margin:16px 0}.panel,.chapter,.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:15px;margin:10px 0}.chapter,.item{cursor:pointer}.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;background:var(--good)}.view{display:none}.view.active{display:block}.item{display:flex;gap:12px;align-items:center}.num{min-width:75px;color:var(--accent);font-weight:800}.itemname{flex:1;overflow-wrap:anywhere}.tick{color:var(--good);font-weight:900}.notes{min-height:55vh;resize:vertical;line-height:1.65}.label{display:block;font-weight:700;margin:16px 0 7px}.toggle{display:flex;gap:10px;align-items:center;padding:12px 0;font-weight:700}.toggle input{width:22px;height:22px;accent-color:var(--good)}.chips,.images,.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{background:var(--tint);padding:7px 10px;border-radius:999px}.chip button{border:0;background:transparent;min-height:20px;padding:0;color:var(--danger)}.images{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}.image-card{border:1px solid var(--line);border-radius:12px;padding:8px}.image-card img{width:100%;height:110px;object-fit:contain}.image-card button{width:100%;margin-top:6px}.buttons button{flex:1}.status{padding:10px 12px;border-radius:12px;background:var(--tint);margin:12px 0}.warn{background:#fff0d8;color:#714800}.error{background:#ffe8eb;color:#8b1d2a}.hidden{display:none!important}.bulk{min-height:130px;font-family:ui-monospace,monospace}.file{display:inline-flex;align-items:center}.formgrid{display:grid;grid-template-columns:1fr;gap:10px}.empty{text-align:center;color:var(--muted);padding:24px}.back{margin:8px 0}.section-title{font-size:1.4rem;line-height:1.25}.hint{margin-top:6px}@media(min-width:640px){.app{padding:22px}.formgrid{grid-template-columns:1fr 1fr}.notes{min-height:520px}}
</style></head><body><main class="app">
<header class="top"><div><div class="brand">CA Inter Law <span class="muted">/ Revision</span></div><div class="muted">Corporate and Other Laws · Private workspace</div></div><button id="theme">☾ Dark mode</button></header>
<div id="status" class="status hidden" role="status"></div>
<section id="home" class="view active"><input id="search" class="search" type="search" placeholder="Search section number or name…" aria-label="Search sections"><div class="row"><h2>Chapters</h2><button id="showAddChapter">＋ Chapter</button></div><div id="results"></div><div id="chapters"></div>
<div class="panel"><h3>Import sections</h3><p class="muted">Choose a chapter and paste lines like <code>12 | Registered office</code>.</p><select id="importTarget" style="width:100%;padding:12px;border-radius:12px;background:var(--panel);color:var(--text);border:1px solid var(--line)"></select><textarea id="bulk" class="bulk" placeholder="1 | Short title&#10;12 | Registered office"></textarea><div class="buttons"><button class="primary" id="import">Import lines</button><button id="export">Export backup</button><label class="file">Restore backup<input id="restore" type="file" accept="application/json" hidden></label></div></div>
<div id="addChapter" class="panel hidden"><h3>Add a chapter</h3><input id="chapterName" placeholder="Chapter name"><button id="createChapter" class="primary" style="margin-top:8px;width:100%">Add chapter</button></div></section>
<section id="chapter" class="view"><button class="back" data-home>← All chapters</button><div class="row"><div><h2 id="chapterTitle"></h2><div id="chapterMeta" class="muted"></div></div><button id="deleteChapter" class="danger">Delete</button></div><div id="sections"></div><div class="panel"><h3>Add a section</h3><div class="formgrid"><input id="sectionNo" placeholder="Section number"><input id="sectionName" placeholder="Section name"></div><button id="addSection" class="primary" style="margin-top:8px;width:100%">Add section</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Paste many lines</h3><textarea id="chapterBulk" class="bulk" placeholder="12 | Registered office&#10;13 | Alteration of memorandum"></textarea><button id="chapterImport" class="primary" style="margin-top:8px;width:100%">Import lines</button></div></section>
<section id="editor" class="view"><button class="back" id="backChapter">← Chapter sections</button><div class="muted" id="breadcrumb"></div><h2 id="sectionTitle" class="section-title"></h2><div class="panel"><label class="toggle"><input type="checkbox" id="revised"> Mark as revised</label><label class="label" for="keyword">Keywords</label><input id="keyword" placeholder="Type keyword and press Enter"><div id="chips" class="chips"></div><label class="label" for="notes">Notes, mind-map points and case laws</label><textarea id="notes" class="notes" placeholder="Write detailed notes here. Three pages or more are supported, subject to available device/server storage."></textarea><label class="label">Pictures / handwritten notes</label><label class="file">＋ Add pictures<input id="pictures" type="file" accept="image/*" multiple hidden></label><div class="hint">Images resize to about 1000 px and are compressed before upload.</div><div id="images" class="images"></div><div class="buttons"><button id="prev">← Previous</button><button id="next" class="primary">Next →</button></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let chapters=[],chapterId=null,sectionId=null,saveTimer=null,theme='light';
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let data;const ct=r.headers.get('content-type')||'';data=ct.includes('json')?await r.json():await r.text();if(!r.ok)throw new Error(data.error||'Request failed');return data}
function msg(t,type=''){const e=$('status');e.textContent=t;e.className='status '+type}
function view(id){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}
function cNow(){return chapters.find(c=>c.id===chapterId)}function sNow(){return cNow()?.sections.find(s=>s.id===sectionId)}
async function refresh(){chapters=await api('/api/chapters');renderHome()}
function renderHome(){const q=$('search').value.trim().toLowerCase();$('chapters').innerHTML=chapters.map(c=>`<article class="chapter" data-c="${c.id}"><div class="row"><strong>${esc(c.name)}</strong><span class="muted">${c.revised}/${c.total}</span></div><div class="progress"><span style="width:${c.progress}%"></span></div><div class="muted">${c.progress}% revised</div></article>`).join('')||'<div class="empty">No chapters yet. Add one, then add sections or import your syllabus.</div>';$('chapters').querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>openChapter(+e.dataset.c));$('importTarget').innerHTML=chapters.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');if(q){const found=[];chapters.forEach(c=>c.sections.forEach(s=>{if(s.number.toLowerCase().includes(q)||s.name.toLowerCase().includes(q))found.push({c,s})}));$('results').innerHTML='<h3>Search results</h3>'+(found.map(({c,s})=>`<div class="item" data-r="${c.id},${s.id}"><span class="num">${esc(s.number)}</span><span class="itemname">${esc(s.name)}<div class="muted">${esc(c.name)}</div></span>${s.revised?'<span class="tick">✓</span>':''}</div>`).join('')||'<div class="empty">No matches.</div>');$('results').querySelectorAll('[data-r]').forEach(e=>e.onclick=()=>{const [c,s]=e.dataset.r.split(',').map(Number);openSection(c,s)})}else $('results').innerHTML=''}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function openChapter(id){chapterId=id;const c=await api('/api/chapters/'+id);$('chapterTitle').textContent=c.name;$('chapterMeta').textContent=`${c.revised} of ${c.total} revised (${c.progress}%)`;$('sections').innerHTML=c.sections.map(s=>`<div class="item" data-s="${s.id}"><span class="num">${esc(s.number)}</span><span class="itemname">${esc(s.name)}</span>${s.revised?'<span class="tick">✓</span>':''}</div>`).join('')||'<div class="empty">No sections yet. Add one below.</div>';$('sections').querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>openSection(id,+e.dataset.s));view('chapter')}
async function openSection(cid,sid){chapterId=cid;sectionId=sid;const c=await api('/api/chapters/'+cid),s=c.sections.find(x=>x.id===sid);if(!s)return;$('breadcrumb').textContent=c.name+' · Section '+s.number;$('sectionTitle').textContent=s.name;$('revised').checked=s.revised;$('notes').value=s.notes||'';$('keyword').value='';renderChips(s);renderImages(s);const i=c.sections.findIndex(x=>x.id===sid);$('prev').disabled=i<=0;$('next').disabled=i>=c.sections.length-1;view('editor')}
function renderChips(s){$('chips').innerHTML=(s.keywords||[]).map((k,i)=>`<span class="chip">${esc(k)} <button data-k="${i}" aria-label="Remove keyword">×</button></span>`).join('');$('chips').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{s.keywords.splice(+b.dataset.k,1);saveSection({keywords:s.keywords});renderChips(s)})}
function renderImages(s){$('images').innerHTML=(s.images||[]).map((im,i)=>`<div class="image-card"><img src="${im}" alt="Revision image"><button class="danger" data-im="${i}">Remove</button></div>`).join('');$('images').querySelectorAll('[data-im]').forEach(b=>b.onclick=()=>{s.images.splice(+b.dataset.im,1);saveSection({images:s.images});renderImages(s)})}
async function saveSection(changes){try{await api('/api/sections/'+sectionId,{method:'PUT',body:JSON.stringify(changes)});await refresh()}catch(e){msg('Save failed: '+e.message,'error')}}
function parseLines(t){return t.split(/\r?\n/).map(x=>{const m=x.trim().match(/^(.+?)\s*\|\s*(.+)$/);return m?{number:m[1].trim(),name:m[2].trim()}:null}).filter(Boolean)}
async function importTo(id,text){const data=await api(`/api/chapters/${id}/sections`,{method:'POST',body:JSON.stringify({bulk:text})});msg(`${data.added} section(s) imported.`);await refresh();return data}
function compress(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(r.error);r.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const scale=Math.min(1,1000/Math.max(im.width,im.height)),can=document.createElement('canvas');can.width=Math.max(1,Math.round(im.width*scale));can.height=Math.max(1,Math.round(im.height*scale));can.getContext('2d').drawImage(im,0,0,can.width,can.height);let q=.8,out=can.toDataURL('image/jpeg',q);while(out.length>500000&&q>.4){q-=.1;out=can.toDataURL('image/jpeg',q)}resolve(out)};im.src=r.result};r.readAsDataURL(file)})}
$('search').oninput=renderHome;$('showAddChapter').onclick=()=>$('addChapter').classList.toggle('hidden');
$('createChapter').onclick=async()=>{try{const name=$('chapterName').value.trim();if(!name)return msg('Enter a chapter name.','warn');await api('/api/chapters',{method:'POST',body:JSON.stringify({name})});$('chapterName').value='';$('addChapter').classList.add('hidden');await refresh();msg('Chapter added.')}catch(e){msg(e.message,'error')}};
$('addSection').onclick=async()=>{try{const number=$('sectionNo').value.trim(),name=$('sectionName').value.trim();if(!number||!name)return msg('Enter section number and name.','warn');await api(`/api/chapters/${chapterId}/sections`,{method:'POST',body:JSON.stringify({number,name})});$('sectionNo').value='';$('sectionName').value='';await openChapter(chapterId);await refresh();msg('Section added.')}catch(e){msg(e.message,'error')}};
$('chapterImport').onclick=async()=>{try{await importTo(chapterId,$('chapterBulk').value);$('chapterBulk').value='';await openChapter(chapterId)}catch(e){msg(e.message,'error')}};
$('import').onclick=async()=>{try{if(!$('importTarget').value)return msg('Create a chapter first.','warn');await importTo(+$('importTarget').value,$('bulk').value);$('bulk').value=''}catch(e){msg(e.message,'error')}};
$('deleteChapter').onclick=async()=>{if(!confirm('Delete this chapter and all its sections? Export a backup first if needed.'))return;try{await api('/api/chapters/'+chapterId,{method:'DELETE'});await refresh();view('home');msg('Chapter deleted.')}catch(e){msg(e.message,'error')}};
$('revised').onchange=()=>saveSection({revised:$('revised').checked});$('notes').oninput=()=>{clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveSection({notes:$('notes').value}),500)};
$('keyword').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const s=sNow(),v=$('keyword').value.trim();if(s&&v&&!s.keywords.some(k=>k.toLowerCase()===v.toLowerCase())){s.keywords.push(v);saveSection({keywords:s.keywords});renderChips(s)}$('keyword').value=''}};
$('pictures').onchange=async e=>{const s=sNow();try{for(const f of [...e.target.files]){if(!f.type.startsWith('image/'))continue;msg('Compressing picture…');s.images.push(await compress(f));await saveSection({images:s.images});renderImages(s)}msg('Pictures saved.')}catch(err){msg('Picture upload failed: '+err.message,'error')}finally{e.target.value=''}};
async function move(dir){const c=await api('/api/chapters/'+chapterId),i=c.sections.findIndex(s=>s.id===sectionId),n=c.sections[i+dir];if(n)openSection(chapterId,n.id)}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('backChapter').onclick=()=>openChapter(chapterId);document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{refresh().then(()=>view('home'))});
$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;$('theme').textContent=theme==='dark'?'☀ Light mode':'☾ Dark mode';try{localStorage.setItem('ca-law-theme',theme)}catch(e){}};
$('export').onclick=()=>{location.href='/api/export'};
$('restore').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.chapters))throw Error('Invalid backup');if(!confirm('Restore and replace all current chapters and notes?'))return;await api('/api/import',{method:'POST',body:JSON.stringify(data)});await refresh();msg('Backup restored.')}catch(err){msg('Restore failed: '+err.message,'error')}finally{e.target.value=''}};
(async()=>{try{theme=localStorage.getItem('ca-law-theme')||'light';document.documentElement.dataset.theme=theme;$('theme').textContent=theme==='dark'?'☀ Light mode':'☾ Dark mode';await refresh()}catch(e){msg('Could not connect to backend. Start the server using npm start. '+e.message,'error')}})();
</script></body></html>
